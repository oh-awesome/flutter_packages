name: camera_example
description: Demonstrates how to use the camera plugin.
publish_to: none

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  camera_ohos:
    # When depending on this package from a real application you should use:
    #   camera_android: ^x.y.z
    # See https://dart.dev/tools/pub/dependencies#version-constraints
    # The example app is bundled with the plugin so we use a path dependency on
    # the parent directory to use the current plugin's version.
    path: ../
  camera_platform_interface: ^2.6.0
  flutter:
    sdk: flutter
  quiver: ^3.0.0
  path_provider:
    git:
      url: "https://gitcode.com/openharmony-sig/flutter_packages.git"
      path: "packages/path_provider/path_provider"
  video_player:
    git:
      url: "https://gitcode.com/openharmony-sig/flutter_packages.git"
      path: "packages/video_player/video_player"

dependency_overrides:
  path_provider_ohos: 
    git:
      url: "https://gitcode.com/openharmony-sig/flutter_packages.git"
      path: "packages/path_provider/path_provider_ohos"
  video_player_ohos:
    git:
      url: "https://gitcode.com/openharmony-sig/flutter_packages.git"
      path: "packages/video_player/video_player_ohos"
  # OHOS fork SDKs (>= 3.27) lack `UnmodifiableUint8ListView` in dart:typed_data;
  # win32 >= 3.1 uses it and fails the kernel compile even though win32
  # never runs on OHOS. Pin to 3.0.1 (the newest release without that usage).
  win32: 3.0.1



dev_dependencies:
  build_runner: ^2.1.10
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

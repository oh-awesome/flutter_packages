name: camera_ohos_example
description: Demonstrates how to use the camera plugin.
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  camera_ohos:
    # When depending on this package from a real application you should use:
    #   camera_android: ^x.y.z
    # See https://dart.dev/tools/pub/dependencies#version-constraints
    # The example app is bundled with the plugin so we use a path dependency on
    # the parent directory to use the current plugin's version.
    path: ../
  camera_platform_interface: ^2.6.0
  flutter:
    sdk: flutter
  quiver: ^3.0.0
  path_provider:
    git:
      url: "https://gitcode.com/openharmony-sig/flutter_packages.git"
      path: "packages/path_provider/path_provider"
      ref: "br_path_provider-v2.1.5_ohos"
  video_player:
    git:
      url: "https://gitcode.com/openharmony-sig/flutter_packages.git"
      path: "packages/video_player/video_player"
      ref: "br_video_player-v2.10.1_ohos"

dependency_overrides:
  path_provider_foundation:
    git:
      url: "https://gitcode.com/openharmony-sig/flutter_packages.git"
      path: "packages/path_provider/path_provider_foundation"
      ref: "br_path_provider-v2.1.5_ohos"
  pigeon:
    git:
      url: "https://gitcode.com/openharmony-sig/flutter_packages.git"
      path: "packages/pigeon"
      ref: "br_pigeon-v26.1.5_ohos"


dev_dependencies:
  build_runner: ^2.1.10
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

name: webview_flutter_ohos_example
description: Demonstrates how to use the webview_flutter_ohos plugin.
publish_to: none

environment:
  sdk: ">=2.19.0 <4.0.0"
  flutter: ">=3.7.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.0.6
  webview_flutter_ohos:
    path: ../
  webview_flutter_platform_interface:
    git:
      url: "https://gitcode.com/openharmony-tpc/flutter_packages.git"
      path: "packages/webview_flutter_platform_interface-v2.10.0/webview_flutter_platform_interface"

dev_dependencies:
  espresso: ^0.2.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/sample_audio.ogg
    - assets/sample_video.mp4
    - assets/www/index.html
    - assets/www/styles/style.css

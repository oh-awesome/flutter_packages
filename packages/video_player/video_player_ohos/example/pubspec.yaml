name: example
description: An example Flutter application for video_player_ohos.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+2

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  integration_test:
    sdk: flutter
  flutter:
    sdk: flutter
  video_player_ohos:
    path: ../
  video_player_platform_interface: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

dependency_overrides:
  path_provider:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_packages.git
      path: packages/path_provider/path_provider
      ref: "br_path_provider-v2.1.5_ohos"

flutter:
  uses-material-design: true
  assets:
    - assets/flutter-mark-square-64.png
    - assets/Butterfly-209.mp4
    - assets/video1.mp4

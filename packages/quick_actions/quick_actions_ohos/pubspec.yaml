name: quick_actions_ohos
description: An implementation for the OpenHarmony platform of the Flutter `quick_actions` plugin.
repository: https://github.com/flutter/packages/tree/main/packages/quick_actions/quick_actions_ohos
issue_tracker: https://github.com/flutter/flutter/issues?q=is%3Aissue+is%3Aopen+label%3A%22p%3A+quick_actions%22
version: 1.0.0

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=3.7.0"

flutter:
  plugin:
    implements: quick_actions
    platforms:
      ohos:
        pluginClass: QuickActionsPlugin
        dartPluginClass: QuickActionsOhos

dependencies:
  flutter:
    sdk: flutter
  quick_actions_platform_interface: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.7
  coverage: ^1.6.3

# Generate a coverage report with:
#   flutter test --coverage
# The generated coverage/lcov.info can be filtered to exclude generated code
# (lib/src/messages.g.dart) when computing project metrics.

topics:
  - quick-actions
  - os-integration
